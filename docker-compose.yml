services:
  app:
    build: .
    volumes:
      - .:/var/www
      - dbdata:/var/www/database
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: >
      sh -c "cp .env.example .env &&
              php artisan key:generate &&
              php artisan migrate --seed &&
              php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  dbdata: